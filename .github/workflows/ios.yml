name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Boilerplate/Boilerplate.xcodeproj
  SCHEME: Boilerplate

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          # Deliberately not pinning a specific /Applications/Xcode_*.app here.
          # GitHub-hosted runners ship several Xcode versions side by side, but
          # only the one selected by default (via `xcode-select`) is guaranteed
          # to have its iOS Simulator platform/runtime already installed —
          # switching to an arbitrary alternate version can leave you with a
          # device type but no matching runtime ("iOS NN.N is not installed").
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun simctl list devices available

      - name: Resolve simulator destination
        id: destination
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -m 1 -E '^\s+iPhone' \
            | sed -E 's/^[[:space:]]+//; s/ \(.*$//')
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator found; falling back to a generic destination." >&2
            echo "generic=true" >> "$GITHUB_OUTPUT"
          else
            echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
            echo "generic=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          set -o pipefail
          if [ "${{ steps.destination.outputs.generic }}" = "true" ]; then
            DESTINATION='generic/platform=iOS Simulator'
          else
            DESTINATION="platform=iOS Simulator,name=${{ steps.destination.outputs.device }}"
          fi
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet || true
