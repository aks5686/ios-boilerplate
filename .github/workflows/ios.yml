name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Boilerplate/Boilerplate.xcodeproj
  SCHEME: Boilerplate

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install iOS Simulator platform
        run: |
          # This runner's default Xcode may not have the iOS Simulator runtime
          # installed at all (only e.g. visionOS runtimes present), which is why
          # named destinations like "iPhone 16 Pro" fail to resolve regardless of
          # which name is picked. Installing the platform explicitly guarantees a
          # matching runtime exists before we try to create a device against it.
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      - name: Create test simulator
        id: destination
        run: |
          set -o pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")][0].identifier')
          if [ -z "$RUNTIME_ID" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "No iOS runtime available after platform install." >&2
            exit 1
          fi

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j \
            | jq -r '[.devicetypes[] | select(.name == "iPhone 15")][0].identifier')

          UDID=$(xcrun simctl create CI-iPhone "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Created simulator $UDID (runtime $RUNTIME_ID)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet || true
