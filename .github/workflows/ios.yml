name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Boilerplate/Boilerplate.xcodeproj
  SCHEME: Boilerplate

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve simulator for testing
        id: destination
        run: |
          # `xcodebuild test` needs a concrete, booted-capable simulator (unlike
          # `build`, which works fine against the generic destination above).
          # Pick the first available iPhone runtime rather than hardcoding a
          # device name/OS version, since the set of pre-installed simulators
          # varies across GitHub-hosted runner images and Xcode versions.
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for device in devices:
        if device['name'].startswith('iPhone'):
            print(device['name'])
            sys.exit(0)
")
          echo "device=${DEVICE:-iPhone 15}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${DEVICE:-iPhone 15}"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet || true
